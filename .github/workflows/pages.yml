name: Publish static aggregate site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the public website
        run: |
          mkdir -p public/assets public/datos
          cp index.html sectores.html trayectorias.html formacion.html metodologia.html public/
          cp assets/estilos.css assets/comun.js assets/biologia.css assets/biologia.js assets/tema-init.js assets/tema.js public/assets/
          cp datos/biologia_datos.json public/datos/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
